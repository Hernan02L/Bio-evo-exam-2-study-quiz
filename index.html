<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIOL 123 Quiz</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="quiz-container">
        <div class="quiz-header">
            <h1><i class="fas fa-flask"></i> BIOL 123 Quiz</h1>
            <div class="lecture-selector">
                <select id="lecture-select">
                    <option value="all">All Lectures</option>
                    <option value="10">Lecture 10</option>
                    <!-- Other lecture options -->
                </select>
            </div>
        </div>

        <div id="quiz-box">
            <div class="question-card">
                <div id="question">Loading questions...</div>
                <div id="choices" class="choices-grid"></div>
                <div id="feedback" class="feedback-box"></div>
            </div>
        </div>

        <div class="quiz-footer">
            <div class="score-box">
                Score: <span id="score">0</span>/<span id="total">0</span>
            </div>
            <button id="next-btn" class="btn-primary" disabled>
                Next Question <i class="fas fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
