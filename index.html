
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BIOL 123 Quiz Game - Updated</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>BIOL 123 Study Quiz</h1>
        <label for="lecture-select">Choose Lecture:</label>
        <select id="lecture-select" onchange="filterQuestions()">
            <option value="all">All</option>
            <option value="10">Lecture 10</option>
            <option value="11">Lecture 11</option>
            <option value="12">Lecture 12</option>
            <option value="13">Lecture 13</option>
            <option value="14">Lecture 14</option>
            <option value="15">Lecture 15</option>
            <option value="16">Lecture 16</option>
            <option value="17">Lecture 17</option>
        </select>
        <div id="quiz-box">
            <div id="question">Loading question...</div>
            <div id="choices"></div>
            <div id="feedback"></div>
            <button id="next-btn" onclick="nextQuestion()">Next Question</button>
        </div>
        <div id="score-box">
            Score: <span id="score">0</span> / <span id="total">0</span>
        </div>
        <button onclick="resetQuiz()">Reset Quiz</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
