
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BIOL 123 Quiz Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>BIOL 123 Quiz</h1>
        <div id="quiz-box">
            <div id="question">Loading question...</div>
            <div id="choices"></div>
            <div id="feedback"></div>
            <button id="next-btn" onclick="nextQuestion()">Next Question</button>
        </div>
        <div id="score-box">
            Score: <span id="score">0</span> / <span id="total">0</span>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
